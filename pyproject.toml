[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "restart-lanczos-mps"
version = "0.1.0"
description = "Restarted Lanczos and MTBL-related solvers for matrix product states"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.14", "gmpy2>=2.1"]
keywords = ["Lanczos", "MTBL", "matrix product states", "tensor networks"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Physics"]

[project.optional-dependencies]
examples = ["matplotlib>=3.7", "jupyterlab>=4", "ipykernel>=6"]
dev = ["pytest>=8", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.7", "build>=1", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["restart_lanczos_mps*", "pytenet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/restart_lanczos_mps/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
